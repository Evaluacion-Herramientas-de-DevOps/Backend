name: Deploy Backend Despachos

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: microservicio_de_despacho
        run: |
          # Construye usando la subcarpeta correcta del microservicio
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Private Backend via Frontend Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }} # IP Pública del Frontend (Actúa como puente)
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. IP PRIVADA DE TU BACKEND (¡REEMPLAZA ESTA IP POR LA REAL DE TU INSTANCIA BACKEND!)
            BACKEND_IP="10.0.X.X"

            # 2. Configurar credenciales de AWS temporales en la sesión del Frontend
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"

            # 3. Obtener dinámicamente el URL del Registry de ECR
            ECR_REGISTRY=$(aws sts get-caller-identity --query "Account" --output text).dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # 4. Iniciar sesión en ECR apuntando remotamente al Docker del Backend Privado
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker -H tcp://$BACKEND_IP:2375 login --username AWS --password-stdin $ECR_REGISTRY
           
            # 5. Descargar la imagen directo en el Backend Privado de forma remota
            sudo docker -H tcp://$BACKEND_IP:2375 pull $ECR_REGISTRY/microservicio_de_despacho:latest

            # 6. Limpieza preventiva en el Backend Privado
            sudo docker -H tcp://$BACKEND_IP:2375 stop back-despachos || true
            sudo docker -H tcp://$BACKEND_IP:2375 rm back-despachos || true
            
            # 7. Ejecutar el nuevo contenedor en el puerto 8082 del Backend Privado
            sudo docker -H tcp://$BACKEND_IP:2375 run -d --name back-despachos -p 8082:8080 $ECR_REGISTRY/microservicio_de_despacho:latest
