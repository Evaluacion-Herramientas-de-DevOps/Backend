name: Deploy Backend Despachos

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          # Importante: Apuntar a la carpeta correcta del microservicio
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest ./back-Despachos_SpringBoot
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest
            docker stop back-despachos || true
            docker rm back-despachos || true
            # Se asume que la red 'app-network' ya existe o se gestiona vía Compose
            docker run -d --name back-despachos \
              -p 8082:8080 \
              --network app-network \
              ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest
