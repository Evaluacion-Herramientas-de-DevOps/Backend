name: Deploy Backend Despachos

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          # Construye la imagen usando tu secreto ECR_REGISTRY exacto
          docker build -t $ECR_REGISTRY/microservicio_de_despacho:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/microservicio_de_despacho:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Private Backend via SSH Tunnel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }} # Usa tu secreto EC2_HOST
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }} # Usa tu secreto EC2_SSH_KEY
          script: |
            BACKEND_IP="10.0.142.227"
            
            # 1. Crear temporalmente la llave en el Frontend para saltar al Backend
            echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
            chmod 400 private_key.pem

            # 2. Conectarse al Backend para autenticarlo con ECR y preparar la carpeta
            ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@$BACKEND_IP << 'EOF'
              aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
              mkdir -p ~/app-backend
            EOF

            # 3. Escribir el archivo docker-compose.yml de manera remota dentro del Backend privado
            ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@$BACKEND_IP "cat << 'INNER_EOF' > ~/app-backend/docker-compose.yml
            version: '3.8'
            services:
              db-ventas:
                image: mysql:8.0
                container_name: db-ventas
                restart: always
                environment:
                  MYSQL_DATABASE: db_ventas
                  MYSQL_ROOT_PASSWORD: root
                volumes:
                  - v_ventas_data:/var/lib/mysql
                networks:
                  - innova-network

              db-despachos:
                image: mysql:8.0
                container_name: db-despachos
                restart: always
                environment:
                  MYSQL_DATABASE: db_despacho
                  MYSQL_ROOT_PASSWORD: root
                volumes:
                  - v_despacho_data:/var/lib/mysql
                networks:
                  - innova-network

              back-ventas:
                image: ${{ secrets.ECR_REGISTRY }}/microservicio_de_ventas:latest
                container_name: back-ventas
                ports:
                  - '8081:8080'
                depends_on:
                  - db-ventas
                environment:
                  - DB_ENDPOINT=db-ventas
                  - DB_PORT=3306
                  - DB_NAME=db_ventas
                  - DB_USERNAME=root
                  - DB_PASSWORD=root
                networks:
                  - innova-network

              back-despachos:
                image: ${{ secrets.ECR_REGISTRY }}/microservicio_de_despacho:latest
                container_name: back-despachos
                ports:
                  - '8082:8080'
                depends_on:
                  - db-despachos
                environment:
                  - DB_ENDPOINT=db-despachos
                  - DB_PORT=3306
                  - DB_NAME=db_despacho
                  - DB_USERNAME=root
                  - DB_PASSWORD=root
                networks:
                  - innova-network

            networks:
              innova-network:
                driver: bridge

            volumes:
              v_ventas_data:
              v_despacho_data:
            INNER_EOF
            "

            # 4. Descargar imágenes actualizadas y levantar el ecosistema completo
            ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@$BACKEND_IP "cd ~/app-backend && docker compose pull && docker compose up -d"

            # 5. Limpiar la llave del puente por seguridad
            rm -f private_key.pem